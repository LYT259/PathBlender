name: Beta verification
on:
  pull_request:
    branches: [beta]
permissions:
  contents: read
env:
  WALK_SHOTS: ${{ github.workspace }}/browser-evidence
concurrency:
  group: beta-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.policy.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - id: policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/beta-change-policy.mjs "$BASE" "$HEAD"
  windows:
    needs: policy
    if: needs.policy.outputs.docs_only == 'false'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Headed: D3D11 WARP WebGL needs the interactive desktop; headless
      # context creation fails with "BindToCurrentSequence failed".
      WALK_HEADFUL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace deps
        run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/candidate-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-windows
          path: browser-evidence
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      - name: Build NSIS installer
        # Same config path as the release job (tauri.conf.json bundle targets).
        # The updater key is a throwaway generated here: the smoke build must
        # produce the same artifacts (setup.exe + .sig) as a release build,
        # but the repo signing key stays release-only.
        shell: bash
        run: |
          cd packages/desktop
          npx tauri signer generate -w "$RUNNER_TEMP/smoke-updater.key" --password "" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/smoke-updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npx tauri build --bundles nsis
      - name: Smoke the updater feed generator
        # The release pipeline's PB_WINDOWS_ARTIFACT branch, exercised for
        # real: the feed must carry a windows-x86_64 entry pointing at the
        # setup.exe with a non-empty signature.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # gen-latest-json exits nonzero when NO platform has artifacts, so
          # the Windows entry must be pointed at explicitly — same env var the
          # release publish job sets (a smoke runner has no macOS bundle).
          ART=$(basename packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          PB_WINDOWS_ARTIFACT="$ART" node scripts/gen-latest-json.mjs "$VERSION" packages/desktop/src-tauri/target/release/bundle > feed.json
          node -e "
            const feed = require('./feed.json');
            const win = feed.platforms['windows-x86_64'];
            if (!win || !win.url.endsWith('_x64-setup.exe') || !win.signature.length) {
              console.error('feed.json missing a valid windows-x86_64 entry:', JSON.stringify(feed));
              process.exit(1);
            }
            console.log('feed OK:', win.url);
          "
      - name: Seed a legacy Service Worker profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.10-beta.25 --repo "$GITHUB_REPOSITORY" \
            --pattern "PathBlender_0.1.10-beta.25_x64-setup.exe" --dir legacy
      - name: Install and close the legacy app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem "legacy/*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "legacy beta.25 setup.exe not found" }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "legacy installer exit code $($p.ExitCode)" }
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq "PathBlender" } |
            Select-Object -First 1
          $installDir = if ($key -and $key.InstallLocation) { $key.InstallLocation } else { "$env:LOCALAPPDATA\PathBlender" }
          $exe = Join-Path $installDir.Trim('"', "'") "pathblender-desktop.exe"
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne "0.1.10-beta.25") { throw "legacy app version is not beta.25" }
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $legacy = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $legacy.Refresh()
            if ($legacy.HasExited) { throw "legacy app exited before its first welcome page" }
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "PathBlender")
            $main = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            $button = $null
            if ($main) {
              $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Import path files")
              $button = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            }
            if ($button) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (-not $button) { throw "legacy first launch has no real welcome content" }
          $workerDir = Join-Path $env:LOCALAPPDATA "org.gh-frc.pathblender\EBWebView\Default\Service Worker\ScriptCache"
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $workerFiles = @(Get-ChildItem -Path $workerDir -Recurse -File -ErrorAction SilentlyContinue)
            if ($workerFiles.Count -gt 0) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if ($workerFiles.Count -eq 0) { throw "legacy profile has no Service Worker script cache; recovery test would be vacuous" }
          if (-not $legacy.CloseMainWindow()) { throw "legacy app refused CloseMainWindow" }
          if (-not $legacy.WaitForExit(30000)) { throw "legacy app did not exit after CloseMainWindow" }
          "legacy beta.25 first welcome verified; graceful exit complete; worker files: $($workerFiles.Count); profile retained for candidate recovery" | Out-File -FilePath legacy-worker-seed.txt -Encoding utf8
      - name: Silent install (per-user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::no setup.exe found"; exit 1 }
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::installer exit code $($p.ExitCode)"; exit 1 }
      - name: Locate, launch and assert
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Install location from the per-user uninstall registry entry
          # (currentUser NSIS installs under HKCU), with the known default as
          # fallback.
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq "PathBlender" } |
            Select-Object -First 1
          $installDir = if ($key -and $key.InstallLocation) { $key.InstallLocation } else { "$env:LOCALAPPDATA\PathBlender" }
          $installDir = $installDir.Trim('"', "'")
          $exe = Join-Path $installDir "pathblender-desktop.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::pathblender-desktop.exe not found at $exe"
            Get-ChildItem -Path $installDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $actual = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed version: $actual (tree: $expected)"
          if ($actual -ne $expected) { Write-Host "::error::installed version $actual != tree version $expected"; exit 1 }

          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15
          $proc = Get-Process -Name "pathblender-desktop" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { Write-Host "::error::PathBlender process not running 15s after launch"; exit 1 }
          $proc.Refresh()
          if (-not $proc.MainWindowTitle) { Write-Host "::error::PathBlender running but has no main window"; exit 1 }
          Write-Host "Window title: '$($proc.MainWindowTitle)'"
          if ($proc.MainWindowTitle -ne "PathBlender") { Write-Host "::warning::unexpected window title" }
          "running, window: $($proc.MainWindowTitle), version: $actual" | Out-File -FilePath smoke-result.txt
      - name: Open Preferences on the candidate build
        # The published-artifact update workflow cannot cover a branch-side
        # window fix. Exercise the actual candidate: Help > Check for updates
        # must open a populated Preferences window with its channel combobox.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Save-CandidateScreen {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("$PWD/preferences-candidate.png")
            $g.Dispose(); $bmp.Dispose()
          }
          function Wait-Window([string]$Name, [int]$Seconds) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $Name)
              $win = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
              if ($win) { return $win }
              Start-Sleep -Milliseconds 500
            }
            return $null
          }
          function Wait-Element($Root, [string]$Name, [int]$Seconds) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $Name)
              $all = $Root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)
              foreach ($el in $all) {
                if (-not $el.Current.IsEnabled) { continue }
                $pat = $null
                if ($el.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pat)) { return $el }
                if ($el.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$pat)) { return $el }
                if ($el.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern, [ref]$pat)) { return $el }
              }
              Start-Sleep -Milliseconds 400
            }
            return $null
          }
          function Wait-ControlType($Root, $Type, [int]$Seconds) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, $Type)
              $all = $Root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)
              foreach ($el in $all) {
                if ($el.Current.IsEnabled) { return $el }
              }
              Start-Sleep -Milliseconds 400
            }
            return $null
          }
          function Invoke-Element($El) {
            $pat = $null
            if ($El.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pat)) { $pat.Invoke(); return }
            if ($El.TryGetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern, [ref]$pat)) { $pat.Select(); return }
            if ($El.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern, [ref]$pat)) { $pat.Expand(); return }
            throw "element not invokable: $($El.Current.Name)"
          }
          function Invoke-MenuItem($El) {
            $pat = $null
            if ($El.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$pat)) { $pat.Invoke(); return $true }
            $legacy = $null
            if ($El.TryGetCurrentPattern([System.Windows.Automation.AutomationElement]::LegacyIAccessiblePattern, [ref]$legacy)) { $legacy.DoDefaultAction(); return $true }
            return $false
          }
          function Open-HelpMenuItem($main, [string]$ItemName, [int]$Seconds) {
            $help = Wait-Element $main "Help" 30
            if (-not $help) { return $false }
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              try {
                $pat = $null
                if ($help.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern, [ref]$pat)) { $pat.Expand() }
                elseif (-not (Invoke-MenuItem $help)) { Start-Sleep -Milliseconds 400; continue }
                $itemCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $ItemName)
                $item = $help.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $itemCond)
                if (-not $item) {
                  $menuCond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Menu)
                  foreach ($popup in [System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $menuCond)) {
                    $item = $popup.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $itemCond)
                    if ($item) { break }
                  }
                }
                if ($item -and (Invoke-MenuItem $item)) { return $true }
              } catch {
                # A transient menu closure is retried inside the deadline.
              }
              Start-Sleep -Milliseconds 300
            }
            return $false
          }
          Save-CandidateScreen
          try {
            $main = Wait-Window "PathBlender" 30
            if (-not $main) { Write-Host "::error::candidate main window not found"; exit 1 }
            if (-not (Wait-Element $main "Import path files" 30)) { Write-Host "::error::candidate main welcome content missing after legacy profile recovery"; exit 1 }
            $main.SetFocus()
            if (-not (Open-HelpMenuItem $main "Check for updates" 20)) { Write-Host "::error::Help > Check for updates was not invokable"; exit 1 }
            $prefs = Wait-Window "Preferences" 30
            if (-not $prefs) { Write-Host "::error::Preferences window did not open"; exit 1 }
            $updates = Wait-Element $prefs "Updates" 30
            if (-not $updates) { Write-Host "::error::Updates tab not found on the candidate build"; exit 1 }
            Invoke-Element $updates
            $channel = Wait-Element $prefs "Update channel" 30
            if (-not $channel) { $channel = Wait-ControlType $prefs ([System.Windows.Automation.ControlType]::ComboBox) 15 }
            if (-not $channel) { Write-Host "::error::Update channel control not found on the candidate build"; exit 1 }
            Write-Host "Preferences opened with a live channel combobox on the candidate build"
          } finally {
            Save-CandidateScreen
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-verify-windows-preferences
          path: preferences-candidate.png
          if-no-files-found: error
      - name: Build offline NSIS installer
        # Beta-gate the second Windows artifact too: the overlay build embeds
        # the WebView2 Evergreen Standalone Installer. A bash step's exports
        # do not survive the step, so the throwaway key is re-read here.
        shell: bash
        run: |
          cd packages/desktop
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/smoke-updater.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npx tauri build --config src-tauri/tauri.windows-offline.conf.json --bundles nsis
      - name: Assert offline artifact size
        # An "offline" build below 100 MiB means the overlay was not applied —
        # the exe is just another online installer. Stage it under the pinned
        # published name so the gate installs the exact asset users download.
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          NSIS_DIR=packages/desktop/src-tauri/target/release/bundle/nsis
          SIZE=$(stat -c %s "$NSIS_DIR/PathBlender_${V}_x64-setup.exe")
          if [ "$SIZE" -lt 104857600 ]; then
            echo "::error::offline installer is ${SIZE} bytes (< 104857600) — overlay not applied?"
            exit 1
          fi
          cp "$NSIS_DIR/PathBlender_${V}_x64-setup.exe" "$NSIS_DIR/PathBlender_${V}_x64-offline-setup.exe"
          echo "offline installer: PathBlender_${V}_x64-offline-setup.exe, ${SIZE} bytes"
      - name: Stop the online-installed PathBlender before the offline install
        # The online assert step above leaves the app running. The offline
        # NSIS install must not reinstall over a live process, and the
        # offline launch assert below must not be satisfied by that leftover
        # process. Only the app's own pinned process name is stopped —
        # never a broad kill that could hit unrelated processes — and a
        # process that refuses to stop fails the job instead of being
        # swallowed.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $leftover = @(Get-Process -Name "pathblender-desktop" -ErrorAction SilentlyContinue)
          if ($leftover.Count -eq 0) {
            Write-Host "No leftover PathBlender process to stop"
          } else {
            Write-Host "Stopping $($leftover.Count) leftover PathBlender process(es)"
            foreach ($p in $leftover) { Stop-Process -Id $p.Id -Force }
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $leftover = @(Get-Process -Name "pathblender-desktop" -ErrorAction SilentlyContinue)
            } while ($leftover.Count -gt 0 -and (Get-Date) -lt $deadline)
            if ($leftover.Count -gt 0) {
              Write-Host "::error::$($leftover.Count) PathBlender process(es) still running 30s after Stop-Process — refusing to install offline over a live app"
              exit 1
            }
            Write-Host "Leftover PathBlender process(es) stopped"
          }
      - name: Silent install (offline)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "packages/desktop/src-tauri/target/release/bundle/nsis/*_x64-offline-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host "::error::no offline setup.exe found"; exit 1 }
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::offline installer exit code $($p.ExitCode)"; exit 1 }
      - name: Locate, launch and assert (offline)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Install location from the per-user uninstall registry entry
          # (currentUser NSIS installs under HKCU), with the known default as
          # fallback.
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -eq "PathBlender" } |
            Select-Object -First 1
          $installDir = if ($key -and $key.InstallLocation) { $key.InstallLocation } else { "$env:LOCALAPPDATA\PathBlender" }
          $installDir = $installDir.Trim('"', "'")
          $exe = Join-Path $installDir "pathblender-desktop.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::pathblender-desktop.exe not found at $exe"
            Get-ChildItem -Path $installDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $actual = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed version: $actual (tree: $expected)"
          if ($actual -ne $expected) { Write-Host "::error::installed version $actual != tree version $expected"; exit 1 }

          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15
          $proc = Get-Process -Name "pathblender-desktop" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) { Write-Host "::error::PathBlender process not running 15s after launch"; exit 1 }
          $proc.Refresh()
          if (-not $proc.MainWindowTitle) { Write-Host "::error::PathBlender running but has no main window"; exit 1 }
          Write-Host "Window title: '$($proc.MainWindowTitle)'"
          if ($proc.MainWindowTitle -ne "PathBlender") { Write-Host "::warning::unexpected window title" }
          "offline install running, window: $($proc.MainWindowTitle), version: $actual" | Out-File -FilePath smoke-offline-result.txt
      - name: Relaunch the offline app after a graceful close
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $proc = Get-Process -Name "pathblender-desktop" -ErrorAction Stop | Select-Object -First 1
          $exe = $proc.Path
          if (-not $proc.CloseMainWindow()) { throw "offline app refused CloseMainWindow" }
          if (-not $proc.WaitForExit(30000)) { throw "offline app did not exit after CloseMainWindow" }
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $second = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $second.Refresh()
            if ($second.HasExited) { throw "offline second launch exited before the welcome page" }
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "PathBlender")
            $main = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            $button = $null
            if ($main) {
              $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Import path files")
              $button = $main.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            }
            if ($button) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (-not $button) { throw "offline second launch has no real welcome content" }
          "offline second launch has real welcome content (Import path files), pid $($second.Id)" | Out-File -FilePath second-launch-result.txt -Encoding utf8
      - name: Screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD/smoke-screenshot.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "Screenshot saved: $PWD/smoke-screenshot.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-verify-windows
          path: |
            smoke-screenshot.png
            preferences-candidate.png
            smoke-result.txt
            smoke-offline-result.txt
            legacy-worker-seed.txt
            second-launch-result.txt
            packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  macos:
    needs: policy
    if: needs.policy.outputs.docs_only == 'false'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/candidate-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-macos
          path: browser-evidence
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      - name: Build and seal Universal DMG with a disposable verification key
        shell: bash
        run: |
          set -euo pipefail
          cd packages/desktop
          npx tauri signer generate -w "$RUNNER_TEMP/verify.key" --password "" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/verify.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npx tauri build --target universal-apple-darwin --bundles app
          cd ../..
          VERSION=$(node -p "require('./package.json').version")
          scripts/package-desktop-artifacts.sh "$VERSION" --target universal-apple-darwin
      - name: Install from the DMG and launch the installed app
        shell: bash
        run: bash scripts/verify-candidate-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beta-verify-macos
          path: candidate-macos.png
          if-no-files-found: error

  linux:
    needs: policy
    if: needs.policy.outputs.docs_only == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Headed under xvfb-run: Mesa llvmpipe WebGL needs an X display;
      # headless context creation fails with "BindToCurrentSequence failed".
      WALK_HEADFUL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and runtime verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm rpm2cpio cpio xvfb xdotool imagemagick openbox dbus-x11
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Headed under Xvfb (WALK_HEADFUL=1): the --use-angle=gl backend needs
      # an X display; headless would fall back to SwiftShader, whose GL
      # teardown freezes every navigation for 20 s+ (2026-11-05).
      - run: xvfb-run -a node scripts/candidate-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux
          path: browser-evidence
      - run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml
      - name: Build all Linux packages with a disposable verification key
        run: |
          set -euo pipefail
          cd packages/desktop
          npx tauri signer generate -w "$RUNNER_TEMP/verify.key" --password "" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/verify.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npx tauri build --config src-tauri/tauri.linux.conf.json --bundles deb,appimage,rpm
      - name: Install DEB and launch each Linux package
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x900x24' bash scripts/verify-candidate-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beta-verify-linux
          path: candidate-linux-*
          if-no-files-found: error
  gate:
    name: Beta gate
    needs: [policy, macos, windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the policy and every applicable platform
        env:
          POLICY: ${{ needs.policy.result }}
          DOCS_ONLY: ${{ needs.policy.outputs.docs_only }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          test "$POLICY" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$MACOS" = skipped && test "$WINDOWS" = skipped && test "$LINUX" = skipped
          else
            test "$MACOS" = success && test "$WINDOWS" = success && test "$LINUX" = success
          fi
