# Release: on a pushed v* tag, build + sign desktop installers, generate
# the updater feed, and publish a GitHub Release with all artifacts.
# Web app deploys separately via deploy.yml (Pages, push to beta).
#
# Signing: repo secret TAURI_SIGNING_PRIVATE_KEY (content of
# ~/.tauri/pathblender-updater.key) + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (see docs/releasing.md — key backup discipline).
#
# Public releases contain a Universal macOS DMG, Windows NSIS installer,
# Linux DEB/AppImage/RPM, and signed updater artifacts for all four platform keys.
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # Quality gate before any artifact is built: releases fire automatically
  # (beta-channel pre-releases on batched beta.N tags), so the workflow itself
  # must never package a tree that fails the repo's own checks — same gate
  # deploy.yml runs before a Pages deploy.
  checks:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - name: Assert tag name matches tree version
        # The tag IS the version users see — a tag/tree mismatch ships a
        # mislabeled build and desyncs the updater (feed version vs app
        # version). Caught by hand on 2026-10-02 when a beta.4 bump landed
        # between tagging and CI; assert it in CI from now on.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

  build-macos:
    needs: [checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install workspace deps
        run: npm ci
      - name: Build signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd packages/desktop && npx tauri build --target universal-apple-darwin --bundles app
      - name: Package, seal and verify desktop artifacts
        # The shared pipeline scripts/package-desktop-artifacts.sh — the same
        # one install-desktop.sh runs locally: inject the day+night icon
        # catalog, ad-hoc codesign the app, HARD-GATE on strict verification
        # (the old CI flow re-wrapped the icon-injected app without ever
        # sealing it, so downloaded builds failed the seal check every local
        # install passed), then regenerate the updater tar.gz + sig and the
        # dmg from the sealed bundle. Key env declared here because steps do
        # not inherit each other's env.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-desktop-artifacts.sh "${RELEASE_TAG#v}" --target universal-apple-darwin
      - name: Stage artifacts
        run: |
          mkdir -p release
          B=packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          cp "$B/macos/PathBlender.app.tar.gz" "$B/macos/PathBlender.app.tar.gz.sig" release/
          # No `|| true`: a release without a (verified) dmg must fail loudly —
          # beta.22 shipped a pre-seal image collected from a stale path.
          cp "$B/dmg/PathBlender_${RELEASE_TAG#v}_universal.dmg" release/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/

  build-windows:
    needs: [checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace deps
        run: npm ci
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: cd packages/desktop && npx tauri build --bundles nsis
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p release
          cp packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe release/
          cp packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/

  build-linux:
    needs: [checks]
    # Build against the oldest supported glibc/WebKitGTK 4.1 base.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - run: npm ci
      - name: Build Linux installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd packages/desktop && npx tauri build --config src-tauri/tauri.linux.conf.json --bundles deb,appimage,rpm
      - name: Stage artifacts
        run: |
          mkdir -p release
          B=packages/desktop/src-tauri/target/release/bundle
          cp "$B"/deb/*.deb "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig "$B"/rpm/*.rpm release/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/

  publish:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npm ci
      - name: Gather and validate every platform artifact
        run: node scripts/prepare-release-artifacts.mjs "${RELEASE_TAG#v}" artifacts bundle release
      - name: Compose user-facing release notes
        # Single source of per-version user notes (task: one text drives the
        # About page, the GitHub Release body AND the updater feed): the
        # VERSION_NOTES registry that bump-version.mjs maintains, plus the
        # curated known-issues list and the platform/download/update template.
        # Written into bundle/ so gen-latest-json embeds the SAME notes in the
        # updater feed, and kept as release-body.md for gh release create
        # (--generate-notes then appends the commit list as a supplement).
        run: |
          VERSION=${RELEASE_TAG#v}
          node scripts/release-notes-for.mjs "$VERSION" > bundle/RELEASE_NOTES.md
          cp bundle/RELEASE_NOTES.md release-body.md
          cat release-body.md
      - name: Generate updater feeds
        run: |
          VERSION=${RELEASE_TAG#v}
          # Channel routing by tag: a pre-release suffix (-alpha/-beta/-rc)
          # publishes ONLY latest-beta.json and marks the GitHub Release as a
          # prerelease (keeps it out of GitHub's "latest", so stable feeds
          # can never point at a beta build); a stable release publishes both
          # feeds — stable raises the beta channel too.
          CH=$(node scripts/release-channel.mjs "$RELEASE_TAG")
          echo "RELEASE_CHANNEL=$CH" >> "$GITHUB_ENV"  # step-level if: below
          node scripts/gen-latest-json.mjs "$VERSION" bundle > release/latest-beta.json
          if [ "$CH" = "stable" ]; then
            cp release/latest-beta.json release/latest.json
          fi
          cat release/latest-beta.json release/latest.json 2>/dev/null || true
          # ^ debug printout only. A beta tag intentionally publishes just
          # latest-beta.json (stable raises both), so latest.json may not
          # exist here — `cat` must not kill the step under `bash -e`
          # (first seen on the v0.1.4-beta.4 run).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${RELEASE_TAG#v}
          ARGS=(--title "PathBlender v${VERSION}" -F release-body.md --generate-notes)
          if [ "$(node scripts/release-channel.mjs "$RELEASE_TAG")" = "beta" ]; then
            ARGS+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > existing-release.json; then
            node scripts/check-existing-release.mjs existing-release.json release "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${ARGS[@]}" release/*
          fi

  promote-beta-feed:
    needs: publish
    runs-on: ubuntu-latest
    # Only pointer promotion is serialized; every release still publishes.
    # A replaced pending promotion is safe: each survivor selects the newest
    # completed release, rather than promoting its own possibly older build.
    concurrency:
      group: desktop-beta-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - name: Promote the newest completed release monotonically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-beta-feed.mjs
