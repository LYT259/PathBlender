# Release: on a pushed v* tag, build + sign desktop installers, generate
# the updater feed, and publish a GitHub Release with all artifacts.
# Web app deploys separately via deploy.yml (Pages, push to stable).
#
# Signing: repo secret TAURI_SIGNING_PRIVATE_KEY (content of
# ~/.tauri/pathblender-updater.key) + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (see docs/releasing.md — key backup discipline).
#
# Platform matrix: macOS is the only active job today. The Windows and Linux
# jobs below are commented out entirely (not `if: false` stubs) until their
# bundle configs land in tauri.conf.json (NSIS/WebView2 bootstrapper,
# deb/AppImage — report v1.10 §7.1 runtime matrix); uncomment them when those
# land, and note `publish` needs its `needs:` and artifact copies extended too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace deps
        run: npm install
      - name: Build signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd packages/desktop && npx tauri build
      - name: Inject dark-mode app icon + regenerate wrapped artifacts
        # Tauri bundles a plain icns only; scripts/apply-dark-icon.sh adds the
        # day+night Assets.car. Everything tauri wrapped during the build (the
        # updater tar.gz + sig and the dmg) predates the injection, so rebuild
        # them from the icon-complete app — the standalone signer reads
        # TAURI_SIGNING_PRIVATE_KEY from the env set above.
        run: |
          APP=packages/desktop/src-tauri/target/release/bundle/macos/PathBlender.app
          scripts/apply-dark-icon.sh "$APP"
          APP_ABS="$PWD/$APP"
          rm -f "$APP.tar.gz" "$APP.tar.gz.sig"
          (cd "$(dirname "$APP")" && tar -czf "$(basename "$APP").tar.gz" "$(basename "$APP")")
          (cd packages/desktop && npx tauri signer sign "$APP_ABS.tar.gz")
          B=packages/desktop/src-tauri/target/release/bundle
          rm -f "$B"/dmg/*.dmg
          mkdir -p "$B/dmg"
          hdiutil create -volname PathBlender -srcfolder "$APP" -ov \
            -format UDZO "$B/dmg/PathBlender_${GITHUB_REF_NAME#v}_aarch64.dmg" >/dev/null
      - name: Stage artifacts
        run: |
          mkdir -p release
          B=packages/desktop/src-tauri/target/release/bundle
          cp "$B/macos/PathBlender.app.tar.gz" "$B/macos/PathBlender.app.tar.gz.sig" release/
          cp "$B/dmg/PathBlender_"*_aarch64.dmg release/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/

