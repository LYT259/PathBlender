  #         TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  #       run: cd packages/desktop && npx tauri build --bundles nsis
  #     - run: |
  #         mkdir release
  #         cp packages/desktop/src-tauri/target/release/bundle/nsis/* release/
  #     - uses: actions/upload-artifact@v4
  #       with: { name: windows, path: release/ }

  # build-linux:
  #   if: false  # enable when deb/AppImage targets land
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: 23 }
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: npm install
  #     - env:
  #         TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  #         TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  #       run: cd packages/desktop && npx tauri build --bundles deb,appimage
  #     - run: |
  #         mkdir release
  #         cp packages/desktop/src-tauri/target/release/bundle/deb/*.deb release/
  #         cp packages/desktop/src-tauri/target/release/bundle/appimage/* release/
  #     - uses: actions/upload-artifact@v4
  #       with: { name: linux, path: release/ }

  publish:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Gather artifacts
        run: |
          mkdir -p bundle/macos release
          cp artifacts/macos/*.tar.gz* bundle/macos/
          cp artifacts/macos/*.tar.gz* release/
          cp artifacts/macos/*.dmg release/ || true
      - name: Compose user-facing release notes
        # Single source of per-version user notes (task: one text drives the
        # About page, the GitHub Release body AND the updater feed): the
        # VERSION_NOTES registry that bump-version.mjs maintains, plus the
        # curated known-issues list and the platform/download/update template.
        # Written into bundle/ so gen-latest-json embeds the SAME notes in the
        # updater feed, and kept as release-body.md for gh release create
        # (--generate-notes then appends the commit list as a supplement).
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node scripts/release-notes-for.mjs "$VERSION" > bundle/RELEASE_NOTES.md
          cp bundle/RELEASE_NOTES.md release-body.md
          cat release-body.md
      - name: Generate updater feeds
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Channel routing by tag: a pre-release suffix (-alpha/-beta/-rc)
          # publishes ONLY latest-beta.json and marks the GitHub Release as a
          # prerelease (keeps it out of GitHub's "latest", so stable feeds
          # can never point at a beta build); a stable release publishes both
          # feeds — stable raises the beta channel too.
          CH=$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")
          echo "RELEASE_CHANNEL=$CH" >> "$GITHUB_ENV"  # step-level if: below
          node scripts/gen-latest-json.mjs "$VERSION" bundle > release/latest-beta.json
          if [ "$CH" = "stable" ]; then
            cp release/latest-beta.json release/latest.json
          fi
          cat release/latest-beta.json release/latest.json 2>/dev/null || true
          # ^ debug printout only. A beta tag intentionally publishes just
          # latest-beta.json (stable raises both), so latest.json may not
          # exist here — `cat` must not kill the step under `bash -e`
          # (first seen on the v0.1.4-beta.4 run).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARGS=(--title "PathBlender v${VERSION}" -F release-body.md --generate-notes)
          if [ "$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")" = "beta" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}" release/*
      - name: Republish the beta feed onto the latest stable release
        # GitHub's `releases/latest` NEVER resolves to a prerelease, but the
        # desktop app's beta channel reads
        # releases/latest/download/latest-beta.json — so a beta tag alone
        # left beta users stranded on whatever beta feed the last stable
        # shipped (found 2026-10-02: after v0.1.5 + newer betas, the URL
        # still served v0.1.5's feed). latest-beta.json is a LIVE POINTER,
        # not a historical artifact: every beta release re-uploads it onto
        # the current stable release, where releases/latest can always find
        # it. Installer/appendix assets are never touched — only this feed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.RELEASE_CHANNEL == 'beta'
        run: |
          STABLE_TAG="$(gh release view --json tagName --jq .tagName)" || {
            echo "no stable release exists yet — beta feed stays on this prerelease only"; exit 0; }
          gh release upload "$STABLE_TAG" release/latest-beta.json --clobber
          echo "beta feed (latest-beta.json) now on stable release $STABLE_TAG:"
          gh release view "$STABLE_TAG" --json assets --jq '.assets[].name'
