  publish:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Gather artifacts
        run: |
          mkdir -p bundle/macos release
          cp artifacts/macos/*.tar.gz* bundle/macos/
          cp artifacts/macos/*.tar.gz* release/
          cp artifacts/macos/*.dmg release/ || true
      - name: Generate updater feeds
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Channel routing by tag: a pre-release suffix (-alpha/-beta/-rc)
          # publishes ONLY latest-beta.json and marks the GitHub Release as a
          # prerelease (keeps it out of GitHub's "latest", so stable feeds
          # can never point at a beta build); a stable release publishes both
          # feeds — stable raises the beta channel too.
          CH=$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")
          node scripts/gen-latest-json.mjs "$VERSION" bundle > release/latest-beta.json
          if [ "$CH" = "stable" ]; then
            cp release/latest-beta.json release/latest.json
          fi
          cat release/latest-beta.json release/latest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARGS=(--title "PathBlender v${VERSION}" --generate-notes)
          if [ "$(node scripts/release-channel.mjs "$GITHUB_REF_NAME")" = "beta" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${ARGS[@]}" release/*
