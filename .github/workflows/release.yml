# Release: on a pushed v* tag, build + sign desktop installers, generate
# the updater feed, and publish a GitHub Release with all artifacts.
# Web app deploys separately via deploy.yml (Pages, push to stable).
#
# Signing: repo secret TAURI_SIGNING_PRIVATE_KEY (content of
# ~/.tauri/pathblender-updater.key) + TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (see docs/releasing.md — key backup discipline).
#
# Platform matrix: macOS is the only active job today. The Windows and Linux
# jobs below are commented out entirely (not `if: false` stubs) until their
# bundle configs land in tauri.conf.json (NSIS/WebView2 bootstrapper,
# deb/AppImage — report v1.10 §7.1 runtime matrix); uncomment them when those
# land, and note `publish` needs its `needs:` and artifact copies extended too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Quality gate before any artifact is built: releases fire automatically
  # (beta-channel pre-releases on batched beta.N tags), so the workflow itself
  # must never package a tree that fails the repo's own checks — same gate
  # deploy.yml runs before a Pages deploy.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - name: Assert tag name matches tree version
        # The tag IS the version users see — a tag/tree mismatch ships a
        # mislabeled build and desyncs the updater (feed version vs app
        # version). Caught by hand on 2026-10-02 when a beta.4 bump landed
        # between tagging and CI; assert it in CI from now on.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

  build-macos:
    needs: [checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace deps
        run: npm install
      - name: Build signed desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd packages/desktop && npx tauri build
      - name: Package, seal and verify desktop artifacts
        # The shared pipeline scripts/package-desktop-artifacts.sh — the same
        # one install-desktop.sh runs locally: inject the day+night icon
        # catalog, ad-hoc codesign the app, HARD-GATE on strict verification
        # (the old CI flow re-wrapped the icon-injected app without ever
        # sealing it, so downloaded builds failed the seal check every local
        # install passed), then regenerate the updater tar.gz + sig and the
        # dmg from the sealed bundle. Key env declared here because steps do
        # not inherit each other's env.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/package-desktop-artifacts.sh "${GITHUB_REF_NAME#v}"
      - name: Stage artifacts
        run: |
          mkdir -p release
          B=packages/desktop/src-tauri/target/release/bundle
          cp "$B/macos/PathBlender.app.tar.gz" "$B/macos/PathBlender.app.tar.gz.sig" release/
          cp "$B/dmg/PathBlender_"*_aarch64.dmg release/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/

  # build-windows:
  #   if: false  # enable when NSIS/MSI + WebView2 bootstrapper config lands
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
